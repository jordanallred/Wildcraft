<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    Repainted in the shop's actual palette. The previous version was espresso
    and terracotta, left over from the old identity, so the tab icon was the
    one surface still showing colours that appear nowhere else on the site.

    A pin-back button read at 16px: navy ground, one solid orange disc, and the
    maker's "s" knocked out of it. Detail finer than this — a hoop ring, a
    clamp screw — turns to mush at favicon size, so there is none.
  -->
  <rect width="100" height="100" rx="22" fill="#0C2340"/>

  <!-- The button itself -->
  <circle cx="50" cy="50" r="35" fill="#E87722"/>

  <!-- Rim highlight: a hair of paper so the disc doesn't bleed into a light tab bar -->
  <circle cx="50" cy="50" r="35" fill="none" stroke="#FBF7EF" stroke-width="2.5" stroke-opacity="0.35"/>

  <!-- Maker's mark. Navy on orange measures 5.33:1 — legible at 16px. -->
  <text
    x="50"
    y="69"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="54"
    font-style="italic"
    font-weight="600"
    fill="#0C2340"
    text-anchor="middle"
  >s</text>
</svg>
