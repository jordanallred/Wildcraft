<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dark espresso rounded-square background -->
  <rect width="100" height="100" rx="22" fill="#2A1F16"/>

  <!-- Embroidery hoop outer ring -->
  <circle cx="50" cy="50" r="36" fill="none" stroke="#C07040" stroke-width="4.5"/>

  <!-- Hoop clamp at top — the little screw detail -->
  <rect x="44" y="11" width="12" height="6" rx="3" fill="#C07040"/>

  <!-- Fabric fill (very subtle warm tint inside the hoop) -->
  <circle cx="50" cy="50" r="30.5" fill="#C07040" fill-opacity="0.10"/>

  <!-- Italic lowercase "s" — the maker's mark -->
  <text
    x="50"
    y="68"
    font-family="Georgia, 'Palatino Linotype', serif"
    font-size="50"
    font-style="italic"
    font-weight="400"
    fill="#FCF9F4"
    text-anchor="middle"
  >s</text>
</svg>
